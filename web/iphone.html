<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Melody · iPhone 16 Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #2a2a30 0%, #0c0c0e 70%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #scaler {
      transform-origin: center center;
      display: flex; align-items: center; justify-content: center;
    }
    .phone {
      position: relative;
      width: 402px; height: 874px;
      border-radius: 56px;
      padding: 11px;
      flex: none;
      background: linear-gradient(145deg, #3a3a3c 0%, #8e8e93 25%, #2c2c2e 50%, #aeaeb2 75%, #3a3a3c 100%);
      box-shadow:
        0 0 0 2px #1a1a1c,
        0 30px 70px rgba(0,0,0,0.55),
        inset 0 0 4px rgba(255,255,255,0.4);
    }
    .phone::before {
      content: "";
      position: absolute;
      left: -3px; top: 190px; width: 3px; height: 30px;
      background: #6e6e73; border-radius: 2px 0 0 2px;
      box-shadow: 0 44px 0 #6e6e73, 0 90px 0 -1px #6e6e73;
    }
    .phone::after {
      content: "";
      position: absolute;
      right: -3px; top: 230px; width: 3px; height: 64px;
      background: #6e6e73; border-radius: 0 2px 2px 0;
    }
    .screen {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 46px;
      overflow: hidden;
      background: #000;
    }
    .island {
      position: absolute;
      top: 11px; left: 50%; transform: translateX(-50%);
      width: 122px; height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
    }
    iframe {
      width: 100%; height: 100%;
      border: none; display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="scaler">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <iframe src="index.html" id="appFrame"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var scaler = document.getElementById('scaler');
      var W = 402, H = 874;
      function fit(){
        var vw = window.innerWidth, vh = window.innerHeight;
        var pad = 24;
        var s = Math.min((vw - pad) / W, (vh - pad) / H, 1);
        scaler.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      fit();

      var frame = document.getElementById('appFrame');
      var last = null;
      function check(){
        fetch('__build_id.txt', {cache: 'no-store'})
          .then(function(r){ return r.text(); })
          .then(function(t){
            t = (t || '').trim();
            if (last === null) last = t;
            else if (last !== t && t) frame.src = frame.src;
          }).catch(function(){});
      }
      setInterval(check, 1500);
    })();
  </script>
</body>
</html>
