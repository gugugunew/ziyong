<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Melody English · iPhone 15 Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #2a2a2e 0%, #0c0c0e 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 20px;
    overflow: hidden;
  }
  .device {
    position: relative;
    width: 393px;
    height: 852px;
    background: #000;
    border-radius: 54px;
    padding: 11px;
    box-shadow:
      0 0 0 3px #2b2b2d,
      0 0 0 13px #1a1a1c,
      0 0 0 14px #38383a,
      0 30px 80px rgba(0,0,0,0.65),
      0 8px 24px rgba(0,0,0,0.5);
  }
  .btn-volume { position: absolute; left: -3px; width: 3px; background: #3a3a3c; border-radius: 2px 0 0 2px; }
  .btn-vol-up { top: 195px; height: 62px; }
  .btn-vol-dn { top: 272px; height: 62px; }
  .btn-action { position: absolute; left: -3px; top: 152px; width: 3px; height: 32px; background: #3a3a3c; border-radius: 2px 0 0 2px; }
  .btn-power { position: absolute; right: -3px; top: 225px; width: 3px; height: 92px; background: #3a3a3c; border-radius: 0 2px 2px 0; }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #000;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }

  .statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    z-index: 9;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 2px rgba(0,0,0,0.25);
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .statusbar .battery { width: 25px; height: 12px; border: 1.5px solid rgba(255,255,255,0.9); border-radius: 3px; position: relative; }
  .statusbar .battery::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 6px; background: rgba(255,255,255,0.9); border-radius: 0 2px 2px 0; }
  .statusbar .battery::before { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 15px; background: #fff; border-radius: 1px; }

  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    pointer-events: none;
    box-shadow:
      inset 0 0.5px 0 0 rgba(255,255,255,0.16),
      0 1px 2px rgba(0,0,0,0.35);
    border: 0.5px solid rgba(255,255,255,0.07);
  }

  .label { position: absolute; bottom: -34px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 0.3px; }
</style>
</head>
<body>
  <div class="device">
    <div class="btn-action"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-dn"></div>
    <div class="btn-power"></div>

    <div class="screen">
      <iframe src="http://localhost:8090/"></iframe>
      <div class="statusbar">
        <span>9:41</span>
        <span class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="white"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <span class="battery"></span>
        </span>
      </div>
      <div class="island"></div>
    </div>
    <div class="label">iPhone 15 Pro</div>
  </div>
</body>
</html>
